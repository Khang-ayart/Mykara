name: Build prototype APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "schema/**"
      - "tools/**"
      - "docs/*.example.json"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Validate JSON against schemas
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet jsonschema
          /tmp/venv/bin/python tools/validate.py project docs/project.example.json
          /tmp/venv/bin/python tools/validate.py scene docs/scene.example.json
          # project.json do chính mã của app sinh ra (từ kiểm thử đơn vị)
          /tmp/venv/bin/python tools/validate.py project app/build/test-output/sample_project.json
          /tmp/venv/bin/python tools/validate.py project app/build/test-output/sample_project_full.json
          # Scene JSON do SceneBuilder sinh ra
          /tmp/venv/bin/python tools/validate.py scene app/build/test-output/sample_scene.json
          /tmp/venv/bin/python tools/validate.py scene app/build/test-output/sample_scene_portrait.json

      - name: Keep generated samples
        uses: actions/upload-artifact@v4
        with:
          name: generated-samples
          path: app/build/test-output/

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mykara-prototype-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Mykara-prototype.apk
          gh release delete prototype-latest --cleanup-tag -y || true
          gh release create prototype-latest Mykara-prototype.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Mykara prototype (bản dựng mới nhất)" \
            --notes "Bản dựng thử tự động từ commit $GITHUB_SHA"
