name: Build prototype APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mykara-prototype-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Mykara-prototype.apk
          gh release delete prototype-latest --cleanup-tag -y || true
          gh release create prototype-latest Mykara-prototype.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Mykara prototype (bản dựng mới nhất)" \
            --notes "Bản dựng thử tự động từ commit $GITHUB_SHA"
