<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Cảnh thử, cùng nội dung với SampleLyricRenderer.kt (Canvas gốc) để so sánh hai đường vẽ.
// renderFrame(tMs) chỉ phụ thuộc vào tMs, không giữ trạng thái.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 1280, H = 720;

function init(w, h) { W = w; H = h; cv.width = w; cv.height = h; return 'ok'; }

const lines = [
  { s: 600,  e: 3600, text: 'Mưa rơi trên mây trắng', emoji: '☁️', rain: true },
  { s: 3800, e: 7000, text: 'Trái tim vỡ tan',        emoji: '❤️', shatter: 5600 },
  { s: 7400, e: 9800, text: 'Mykara prototype' },
];
const RAIN_COUNT = 120;
const sprites = {};

function sprite(e) {
  if (!sprites[e]) {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    g.font = '200px sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(e, 128, 138);
    sprites[e] = c;
  }
  return sprites[e];
}

function pseudo(i) {
  const x = Math.sin(i * 12.9898) * 43758.5453;
  return (x - Math.floor(x)) * 2 - 1;
}

function hsv(h, s, v) {
  h = ((h % 360) + 360) % 360;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return 'rgb(' + Math.round((r + m) * 255) + ',' + Math.round((g + m) * 255) + ',' + Math.round((b + m) * 255) + ')';
}

function clamp01(x) { return Math.min(1, Math.max(0, x)); }

function renderFrame(tMs) {
  const w = W, h = H;
  const hue = (220 + tMs / 1000 * 6) % 360;
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, hsv(hue, 0.55, 0.35));
  g.addColorStop(1, hsv(hue + 60, 0.55, 0.65));
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  const phase = (tMs % 500) / 500;
  ctx.strokeStyle = 'rgba(255,255,255,' + (1 - phase) + ')';
  ctx.lineWidth = h * 0.006;
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, h * (0.18 + 0.25 * phase), 0, Math.PI * 2);
  ctx.stroke();

  for (const l of lines) {
    if (tMs >= l.s && tMs < l.e) drawLine(l, tMs, w, h);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.78)';
  ctx.font = (h * 0.03) + 'px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('t=' + (tMs / 1000).toFixed(2) + 's', w * 0.03, h * 0.06);
  return 1;
}

function drawLine(l, tMs, w, h) {
  const inP = clamp01((tMs - l.s) / 400);
  const outP = clamp01((l.e - tMs) / 300);
  const a = Math.min(inP, outP);
  const ease = 1 - (1 - inP) * (1 - inP);
  const scale = 0.85 + 0.15 * ease;

  ctx.save();
  ctx.translate(w / 2, h * 0.78);
  ctx.scale(scale, scale);
  ctx.font = 'bold ' + (h * 0.075) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(255,255,255,' + (0.78 * a) + ')';
  ctx.shadowBlur = h * 0.02;
  ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
  ctx.fillText(l.text, 0, 0);
  ctx.restore();
  ctx.shadowBlur = 0;

  if (l.emoji) drawEmoji(l, tMs, w, h, a, ease);
  if (l.rain) drawRain(tMs, w, h, a);
}

function drawEmoji(l, tMs, w, h, a, ease) {
  const bmp = sprite(l.emoji);
  const size = h * 0.30;
  const cx = w / 2;
  const cy = h * 0.38 - (1 - ease) * h * 0.05;

  if (l.shatter !== undefined && tMs >= l.shatter) {
    const p = clamp01((tMs - l.shatter) / 900);
    const n = 4, cell = bmp.width / n, piece = size / n;
    ctx.globalAlpha = (1 - p) * a;
    for (let gy = 0; gy < n; gy++) {
      for (let gx = 0; gx < n; gx++) {
        const idx = gy * n + gx;
        const ox = ((gx + 0.5) / n - 0.5) * size;
        const oy = ((gy + 0.5) / n - 0.5) * size;
        const rx = pseudo(idx * 2), ry = pseudo(idx * 2 + 1);
        const dx = (ox * 2.2 + rx * 0.6 * size) * p;
        const dy = (oy * 2.2 + ry * 0.6 * size) * p + 1.2 * size * p * p;
        ctx.save();
        ctx.translate(cx + ox + dx, cy + oy + dy);
        ctx.rotate(rx * 120 * p * Math.PI / 180);
        ctx.drawImage(bmp, gx * cell, gy * cell, cell, cell, -piece / 2, -piece / 2, piece, piece);
        ctx.restore();
      }
    }
  } else {
    ctx.globalAlpha = a;
    ctx.drawImage(bmp, cx - size / 2, cy - size / 2, size, size);
  }
  ctx.globalAlpha = 1;
}

function drawRain(tMs, w, h, a) {
  const t = tMs / 1000;
  const size = h * 0.30;
  const top = h * 0.38 + size * 0.28;
  const fall = h * 0.28;
  ctx.strokeStyle = 'rgba(170,210,255,' + (0.82 * a) + ')';
  ctx.lineWidth = h * 0.004;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < RAIN_COUNT; i++) {
    const rx = pseudo(i * 3), rs = pseudo(i * 3 + 1), rp = pseudo(i * 3 + 2);
    const speed = h * (1.1 + 0.3 * rs);
    const y = (t * speed + (rp + 1) * 0.5 * fall) % fall;
    const x = w / 2 + rx * size * 0.45 + y * 0.12;
    const len = h * 0.035;
    ctx.moveTo(x, top + y);
    ctx.lineTo(x + len * 0.12, top + y + len);
  }
  ctx.stroke();
}
</script>
</body>
</html>
